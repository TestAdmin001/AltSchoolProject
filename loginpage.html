<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn to Code - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e, #ffa8a8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2x0px;
        }

        .container {
            display: flex;
            max-width: none;
            width: 100%;
            height: 100vh;
            gap: 80px;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
        }

        .left-content {
            flex: 1;
            color: white;
            max-width: 600px;
        }

        .left-content h1 {
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 30px;
        }

        .left-content p {
            font-size: 1.3rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        .login-form {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 450px;
            flex-shrink: 0;
        }

        .trial-banner {
            background: #4a5de5;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e5e9;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a5de5;
        }

        .claim-btn {
            width: 100%;
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.3s ease;
        }

        .claim-btn:hover {
            background: #45b7ae;
        }

        .terms-text {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin-top: 15px;
            line-height: 1.4;
        }

        .terms-text a {
            color: #4a5de5;
            text-decoration: none;
        }

        .terms-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 40px;
            }

            .left-content {
                text-align: center;
            }

            .left-content h1 {
                font-size: 2.5rem;
            }

            .login-form {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-content">
            <h1>Learn to code by watching others</h1>
            <p>See how experienced developers solve problems in real-time. Watching scripted tutorials is great, but understanding how developers think is invaluable.</p>
        </div>

        <div class="login-form">
            <div class="trial-banner">
                Try it free 7 days then $20/mo. thereafter
            </div>

            <form>
                <div class="form-group">
                    <input type="text" placeholder="First Name" required>
                </div>

                <div class="form-group">
                    <input type="text" placeholder="Last Name" required>
                </div>

                <div class="form-group">
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="form-group">
                    <input type="password" placeholder="Password" required>
                </div>

                <button type="submit" class="claim-btn">Claim your free trial</button>

                <p class="terms-text">
                    By clicking the button, you are agreeing to our <a href="#">Terms and Services</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
