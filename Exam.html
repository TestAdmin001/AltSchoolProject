<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch App - AltSchool Project</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        /* Light theme background (default) */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255, 0, 110, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(131, 56, 236, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(58, 134, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 90% 90%, rgba(6, 255, 165, 0.15) 0%, transparent 50%);
            z-index: -1;
            transition: all 0.5s ease;
        }

        /* Dark theme background */
        body.dark-theme {
            background: #2d3748;
        }

        body.dark-theme::before {
            background: none;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            background: rgba(131, 56, 236, 0.3);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            z-index: -1;
            transition: all 0.5s ease;
        }

        .dark-theme .particle {
            display: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* Main stopwatch container with glassmorphism */
        .stopwatch-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 3rem 2.5rem;
            border-radius: 32px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 100%;
            max-width: 480px;
            position: relative;
            animation: containerFloat 6s ease-in-out infinite;
            transition: all 0.5s ease;
        }

        .dark-theme .stopwatch-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Theme toggle with modern styling */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2d3748;
        }

        .dark-theme .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .dark-theme .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
        }

        /* Modern typography */
        h1 {
            color: #2d3748;
            margin-bottom: 2.5rem;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            transition: all 0.5s ease;
        }

        .dark-theme h1 {
            color: white;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff);
            border-radius: 1px;
        }

        /* Ultra-modern timer display */
        .timer-display {
            font-family: 'Inter', monospace;
            font-size: 4rem;
            font-weight: 200;
            color: #2d3748;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.4) 0%, 
                rgba(255, 255, 255, 0.2) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2rem 1.5rem;
            border-radius: 24px;
            margin-bottom: 3rem;
            letter-spacing: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                0 20px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease;
        }

        .dark-theme .timer-display {
            color: white;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.1) 0%, 
                rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .timer-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shine 3s infinite;
        }

        .dark-theme .timer-display::before {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Milliseconds styling */
        .milliseconds {
            font-size: 2.2rem;
            color: rgba(45, 55, 72, 0.6);
            font-weight: 300;
            transition: all 0.5s ease;
        }

        .dark-theme .milliseconds {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Modern button container */
        .buttons {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        /* Revolutionary button design */
        .btn {
            position: relative;
            padding: 16px 32px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 120px;
            backdrop-filter: blur(10px);
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.4s;
        }

        .btn:active::after {
            width: 300px;
            height: 300px;
        }

        /* Individual button styles - Enhanced for light theme */
        .start-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #059669, #10b981);
        }

        .stop-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }

        .stop-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(239, 68, 68, 0.4);
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        .reset-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .reset-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.4);
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
        }

        .lap-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .lap-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, #2563eb, #3b82f6);
        }

        /* Dark theme button adjustments */
        .dark-theme .start-btn {
            background: linear-gradient(135deg, #06ffa5, #00d4aa);
            color: #0a0a0a;
            box-shadow: 0 10px 30px rgba(6, 255, 165, 0.3);
        }

        .dark-theme .start-btn:hover {
            box-shadow: 0 20px 40px rgba(6, 255, 165, 0.4);
            background: linear-gradient(135deg, #00d4aa, #06ffa5);
        }

        .dark-theme .stop-btn {
            background: linear-gradient(135deg, #ff006e, #f72585);
            box-shadow: 0 10px 30px rgba(255, 0, 110, 0.3);
        }

        .dark-theme .stop-btn:hover {
            box-shadow: 0 20px 40px rgba(255, 0, 110, 0.4);
            background: linear-gradient(135deg, #f72585, #ff006e);
        }

        .dark-theme .reset-btn {
            background: linear-gradient(135deg, #8338ec, #a663cc);
            box-shadow: 0 10px 30px rgba(131, 56, 236, 0.3);
        }

        .dark-theme .reset-btn:hover {
            box-shadow: 0 20px 40px rgba(131, 56, 236, 0.4);
            background: linear-gradient(135deg, #a663cc, #8338ec);
        }

        .dark-theme .lap-btn {
            background: linear-gradient(135deg, #3a86ff, #5aa3ff);
            box-shadow: 0 10px 30px rgba(58, 134, 255, 0.3);
        }

        .dark-theme .lap-btn:hover {
            box-shadow: 0 20px 40px rgba(58, 134, 255, 0.4);
            background: linear-gradient(135deg, #5aa3ff, #3a86ff);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Modern lap times */
        .lap-times {
            margin-top: 2rem;
            max-height: 250px;
            overflow-y: auto;
        }

        .lap-times::-webkit-scrollbar {
            width: 6px;
        }

        .lap-times::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }

        .dark-theme .lap-times::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .lap-times::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .dark-theme .lap-times::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
        }

        .lap-times h3 {
            color: #2d3748;
            margin-bottom: 1.5rem;
            font-weight: 300;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        .dark-theme .lap-times h3 {
            color: white;
        }

        .lap-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 1.5rem;
            margin-bottom: 0.8rem;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            color: #2d3748;
            animation: slideIn 0.5s ease;
            transition: all 0.3s ease;
        }

        .lap-time:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        .dark-theme .lap-time {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .dark-theme .lap-time:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .stopwatch-container {
                margin: 1rem;
                padding: 2.5rem 2rem;
                max-width: 95vw;
            }

            h1 {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }

            .timer-display {
                font-size: 3rem;
                padding: 1.5rem 1rem;
                letter-spacing: 2px;
            }

            .milliseconds {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .stopwatch-container {
                padding: 2rem 1.5rem;
            }

            .timer-display {
                font-size: 2.5rem;
            }

            .milliseconds {
                font-size: 1.5rem;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .btn {
                min-width: 200px;
                padding: 18px 36px;
            }
        }

        /* Add micro-animations */
        .btn {
            animation: buttonPulse 4s ease-in-out infinite;
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2); }
        }

        /* Loading animation on page load */
        .stopwatch-container {
            animation: containerLoad 1s ease-out;
        }

        @keyframes containerLoad {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Theme toggle - starts with moon icon for light theme -->
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <!-- Animated particles -->
    <div class="particle" style="top: 10%; left: 10%; width: 4px; height: 4px; animation-delay: 0s;"></div>
    <div class="particle" style="top: 20%; left: 80%; width: 6px; height: 6px; animation-delay: 1s;"></div>
    <div class="particle" style="top: 60%; left: 20%; width: 3px; height: 3px; animation-delay: 2s;"></div>
    <div class="particle" style="top: 80%; left: 70%; width: 5px; height: 5px; animation-delay: 3s;"></div>
    <div class="particle" style="top: 30%; left: 60%; width: 4px; height: 4px; animation-delay: 4s;"></div>

    <div class="stopwatch-container">
        <h1>Stopwatch</h1>
        
        <!-- Ultra-modern timer display -->
        <div class="timer-display" id="display">
            00:00:00<span class="milliseconds" id="milliseconds">.000</span>
        </div>
        
        <!-- Modern button layout -->
        <div class="buttons">
            <button class="btn start-btn" id="startBtn">Start</button>
            <button class="btn stop-btn" id="stopBtn">Stop</button>
            <button class="btn reset-btn" id="resetBtn">Reset</button>
            <button class="btn lap-btn" id="lapBtn">Lap</button>
        </div>

        <!-- Sleek lap times section -->
        <div class="lap-times" id="lapTimes" style="display: none;">
            <h3>Lap Times</h3>
            <div id="lapList"></div>
        </div>
    </div>

    <script>
        // Stopwatch variables
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let lapCounter = 0;

        // Get DOM elements
        const display = document.getElementById('display');
        const millisecondsDisplay = document.getElementById('milliseconds');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapBtn = document.getElementById('lapBtn');
        const themeToggle = document.getElementById('themeToggle');
        const lapTimes = document.getElementById('lapTimes');
        const lapList = document.getElementById('lapList');

        // Start button functionality
        startBtn.addEventListener('click', function() {
            // Should not start multiple timers if clicked again
            if (!isRunning) {
                startTime = Date.now() - elapsedTime;
                // Begins counting time using setInterval()
                timerInterval = setInterval(updateTime, 10);
                isRunning = true;
            }
        });

        // Stop button functionality
        stopBtn.addEventListener('click', function() {
            // Pauses the timer (use clearInterval())
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
            }
        });

        // Reset button functionality
        resetBtn.addEventListener('click', function() {
            // Stops the timer and resets time to 00:00:00
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0;
            lapCounter = 0;
            updateDisplay();
            // Clear lap times
            lapList.innerHTML = '';
            lapTimes.style.display = 'none';
        });

        // Update time function
        function updateTime() {
            elapsedTime = Date.now() - startTime;
            updateDisplay();
        }

        // Update display function - measures hours, minutes, and seconds
        function updateDisplay() {
            // Calculate hours, minutes, and seconds
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor(elapsedTime % 1000);

            // Format time as HH:MM:SS
            const timeString = 
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');

            // Update display
            display.innerHTML = timeString + '<span class="milliseconds" id="milliseconds">.' + 
                                String(milliseconds).padStart(3, '0') + '</span>';
        }

        // BONUS FEATURES

        // Lap functionality (bonus feature)
        lapBtn.addEventListener('click', function() {
            if (isRunning) {
                lapCounter++;
                const currentTime = display.textContent;
                const lapItem = document.createElement('div');
                lapItem.className = 'lap-time';
                lapItem.innerHTML = `<span>Lap ${lapCounter}</span><span>${currentTime}</span>`;
                lapList.insertBefore(lapItem, lapList.firstChild);
                lapTimes.style.display = 'block';
            }
        });

        // Dark/light theme toggle (bonus feature) - Fixed logic
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-theme');
            // Update icon: moon for light theme, sun for dark theme
            themeToggle.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        });

        // Initialize display
        updateDisplay();

        // Add keyboard shortcuts for better UX
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    stopBtn.click();
                } else {
                    startBtn.click();
                }
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                resetBtn.click();
            } else if (e.code === 'KeyL' && isRunning) {
                e.preventDefault();
                lapBtn.click();
            }
        });
    </script>
</body>
</html>
